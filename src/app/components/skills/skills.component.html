<section id="skills" class="section bg-light">
  <div class="container">
    <h2 class="section-title animate-fade-in-up">Skills & Technologies</h2>
    <div class="row">
      <div class="col-12" *ngIf="portfolio$ | async as portfolio">
        <div *ngFor="let category of getCategories()" class="skill-category mb-5">
          <div class="skill-category-panel card-custom animate-scale-in">
            <div class="category-header">
              <div>
                <p class="category-kicker">Capability Area</p>
                <h3 class="category-title">{{ category }}</h3>
              </div>
              <div class="category-count">{{ getSkillsByCategory(category).length }} Skills</div>
            </div>

            <div class="skills-cloud">
              <div class="skill-pill" *ngFor="let skill of getSkillsByCategory(category)">
                <div class="skill-mark">{{ getSkillInitials(skill.name) }}</div>
                <div class="skill-copy">
                  <h4 class="skill-name">{{ skill.name }}</h4>
                  <div class="skill-category-badge">{{ skill.category }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
